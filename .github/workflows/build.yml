name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $out = "package"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $rel = "build/Tangier_artefacts/Release"
          Copy-Item -Recurse "$rel/VST3/Tangier.vst3" "$out/Tangier.vst3"
          Copy-Item "$rel/Standalone/Tangier.exe" "$out/Tangier.exe"
          Copy-Item "README.md","LICENSE","NOTICE.md" $out
          Copy-Item -Recurse "licenses" "$out/licenses"
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $ver = $env:GITHUB_REF_NAME
          } else {
            $ver = "dev-$($env:GITHUB_SHA.Substring(0,7))"
          }
          $asset = "Tangier-$ver-Windows.zip"
          Compress-Archive -Path "$out/*" -DestinationPath $asset -Force
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Tangier-Windows
          path: ${{ env.ASSET }}

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "$env:ASSET" --title "Tangier $env:GITHUB_REF_NAME" --generate-notes
